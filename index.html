<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hungry Critters</title>
<style>
  :root { --bg:#0a0a14; --card:#12121f; --fg:#e8e8f0; --muted:#9a9ab0; --accent:#3de89e; --line:#23233a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:3rem 1rem; background:var(--bg); color:var(--fg);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:36rem; margin:0 auto; text-align:center; }
  h1 { font-size:2.1rem; margin:0 0 .4rem; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:0 0 2.4rem; }
  .links { display:flex; flex-direction:column; gap:.8rem; }
  a.btn { display:block; padding:1rem; background:var(--card); border:1px solid var(--line);
          border-radius:14px; color:var(--accent); text-decoration:none; font-weight:600; }
  a.btn:hover { border-color:var(--accent); }
  footer { margin-top:3rem; color:var(--muted); font-size:.87rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Hungry Critters</h1>
  <p class="sub">Catch the food. Beat your high score.</p>
  <div class="links">
    <a class="btn" href="./privacy.html">Privacy Policy</a>
    <a class="btn" href="./terms.html">Terms of Service</a>
  </div>
  <footer>
    Support: <a href="mailto:merlinjean3004@gmail.com">merlinjean3004@gmail.com</a>
  </footer>
</main>
</body>
</html>
